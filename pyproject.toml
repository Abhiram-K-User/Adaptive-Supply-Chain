[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asci-core"
version = "2.0.0"
description = "Adaptive Supply Chain Intelligence Platform (Integrated Agentic-RAG Edition v2.0)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Adaptive Supply Chain Engineering Team", email = "logistics-ai@asci.org" }
]
keywords = [
    "supply-chain",
    "agentic-rag",
    "logistics",
    "network-flow",
    "pydantic-v2",
    "or-tools",
    "graph-modeling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.7.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "ortools>=9.10.0",
    "scipy>=1.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
geo = [
    "osmnx>=1.9.0"
]
ml = [
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.6.0",
    "rapidfuzz>=3.6.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

